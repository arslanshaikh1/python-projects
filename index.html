                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 relative text-center border border-slate-100">
                    <button 
                      onClick={() => { setShowPayModal(false); setPaySuccess(false); }} 
                      className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 font-bold"
                    >
                      <X className="w-5 h-5" />
                    </button>
                    
                    <h3 className="text-2xl font-black text-slate-900 mb-1">Gurukul Fee Payment</h3>
                    <p className="text-xs text-slate-500 mb-4">Scan QR code via PhonePe, Google Pay, Paytm or UPI app.</p>
                    
                    <div className="bg-slate-100 p-4 rounded-2xl border border-slate-200 inline-block mb-4">
                      <div className="font-mono font-bold text-amber-700 text-sm mb-1">UPI ID: 8840008485@ibl</div>
                      <div className="text-xs font-bold text-slate-700 mb-2">Total Amount: ₹{courseFee}</div>
                      <div className="w-48 h-48 bg-slate-300 mx-auto rounded-xl flex items-center justify-center text-xs font-bold text-slate-600 border">
                        [ SBI QR Code - 6938 ]
                      </div>
                    </div>

                    {!paySuccess ? (
                      <button 
                        onClick={() => setPaySuccess(true)} 
                        className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow text-sm transition"
                      >
                        Maine Payment Kar Diya (Generate Receipt)
                      </button>
                    ) : (
                      <div className="bg-emerald-50 border border-emerald-300 p-4 rounded-2xl text-emerald-900 text-xs text-left space-y-1">
                        <div className="font-bold text-sm text-center mb-2">✅ Payment Successful & Lifetime Valid Slip</div>
                        <div><strong>Receiver:</strong> Chandan Sir (Ck Sir)</div>
                        <div><strong>Bank A/C:</strong> State Bank of India - 6938</div>
                        <div><strong>Amount Paid:</strong> ₹{courseFee}</div>
                        <div><strong>Transaction ID:</strong> GURUKUL{Math.floor(Math.random()*1000000000)}</div>
                        <div><strong>Validity:</strong> Lifetime Verified</div>
                        <div className="pt-2 text-center">
                          <button 
                            onClick={() => { setShowPayModal(false); setActiveTab('dashboard'); }}
                            className="px-4 py-2 bg-amber-600 text-white font-bold rounded-lg text-xs"
                          >
                            Ab Portal Par Jayen ▶
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* AUTH MODAL WITH BATCH SELECTION & WHATSAPP NUMBER */}
              {showAuthModal && (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full overflow-hidden relative p-8">
                    <button 
                      onClick={() => setShowAuthModal(false)}
                      className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100"
                    >
                      <X className="w-5 h-5" />
                    </button>

                    <div className="text-center mb-6">
                      <img 
                        src="Log.png" 
                        alt="Logo" 
                        className="w-14 h-14 rounded-full object-cover mx-auto mb-3 shadow-md border border-amber-400" 
                      />
                      <h3 className="text-2xl font-bold text-slate-900">
                        {authMode === 'signup' ? 'नया खाता बनाएं (Sign Up)' : 'लॉग इन करें (Login)'}
                      </h3>
                      <p className="text-xs text-slate-500 mt-1">Learn with Gurukul (By Ck Sir)</p>
                    </div>

                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      {authMode === 'signup' && (
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">पूरा नाम</label>
                          <input 
                            type="text"
                            required
                            placeholder="जैसे: राहुल शर्मा"
                            value={authForm.name}
                            onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      )}

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">ईमेल आईडी</label>
                        <input 
                          type="email"
                          required
                          placeholder="name@example.com (Sir Admin: ckadmin@gurukul.edu)"
                          value={authForm.email}
                          onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>

                      {authMode === 'signup' && (
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">WhatsApp मोबाइल नंबर (Ck Sir Updates ke liye)</label>
                          <input 
                            type="tel"
                            required
                            placeholder="जैसे: 918840008485"
                            value={authForm.mobile}
                            onChange={(e) => setAuthForm({ ...authForm, mobile: e.target.value })}
                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500"
                          />
                        </div>
                      )}

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">रोल चुनें</label>
                        <select 
                          value={selectedRole} 
                          onChange={(e)=>setSelectedRole(e.target.value)} 
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500"
                        >
                          <option value="Student">छात्र (Student)</option>
                          <option value="Parent">परिवार (Parent)</option>
                          <option value="Teacher">शिक्षक / Ck Sir (Admin Access)</option>
                        </select>
                      </div>

                      {selectedRole === 'Student' && (
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">अपनी कक्षा / Batch चुनें</label>
                          <select 
                            value={authForm.batch} 
                            onChange={(e)=>setAuthForm({ ...authForm, batch: e.target.value })} 
                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500 font-bold text-amber-700"
                          >
                            <option value="Tuition (LKG-10th)">Tuition (LKG-10th)</option>
                            <option value="Class 9th & 10th">Class 9th & 10th Batch</option>
                            <option value="11th & 12th">11th & 12th Batch</option>
                            <option value="CHS Entrance">CHS Entrance Batch</option>
                            <option value="Navodaya / Sainik">Navodaya / Sainik Batch</option>
                          </select>
                        </div>
                      )}

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">पासवर्ड</label>
                        <input 
                          type="password"
                          required
                          placeholder="••••••••"
                          value={authForm.password}
                          onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold text-sm shadow-md transition"
                      >
                        {authMode === 'signup' ? 'खाता बनाएं (Sign Up & Register)' : 'साइन इन करें (Sign In)'}
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* 7. FOOTER */}
              <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                    <div>
                      <div className="flex items-center gap-2 text-white font-bold text-lg mb-3">
                        <img 
                          src="Log.png" 
                          alt="Logo" 
                          className="w-8 h-8 rounded-full object-cover border border-amber-400"
                        />
                        Learn with Gurukul
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        By Chandan Sir (Ck Sir) [M.A + B.Ed]. शिक्षा को सभी छात्रों के लिए सुलभ, सरल और प्रेरणादायक बनाने के संकल्प के साथ।
                      </p>
                    </div>

                    <div>
                      <h4 className="text-white text-xs font-bold uppercase tracking-wider mb-3">क्लास & बोर्ड</h4>
                      <ul className="space-y-2 text-xs">
                        <li className="hover:text-amber-400 cursor-pointer">LKG to 10th Tuition</li>
                        <li className="hover:text-amber-400 cursor-pointer">CHS & Navodaya Entrance</li>
                        <li className="hover:text-amber-400 cursor-pointer">11th & 12th Hindi Medium</li>
                        <li className="hover:text-amber-400 cursor-pointer">Basic to Advance Foundation</li>
                      </ul>
                    </div>

                    <div>
                      <h4 className="text-white text-xs font-bold uppercase tracking-wider mb-3">लिंक्स</h4>
                      <ul className="space-y-2 text-xs">
                        <li className="hover:text-amber-400 cursor-pointer" onClick={() => setActiveTab('home')}>मुख्य पृष्ठ</li>
                        <li className="hover:text-amber-400 cursor-pointer" onClick={() => setActiveTab('courses')}>पाठ्यक्रम</li>
                        <li className="hover:text-amber-400 cursor-pointer" onClick={() => setActiveTab('dashboard')}>लाइव डैशबोर्ड</li>
                      </ul>
                    </div>

                    <div>
                      <h4 className="text-white text-xs font-bold uppercase tracking-wider mb-3">सपोर्ट & सहायता</h4>
                      <p className="text-xs text-slate-400 mb-2">किसी भी सवाल या सहायता के लिए संपर्क करें</p>
                      <span className="inline-block px-3 py-1 bg-slate-800 text-amber-400 text-xs font-mono rounded border border-slate-700">
                        8840008485
                      </span>
                    </div>
                  </div>

                  <div className="border-t border-slate-800 pt-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
                    <p>© 2026 Learn with Gurukul (By Ck Sir). सर्वाधिकार सुरक्षित।</p>
                    <div className="flex gap-4 mt-2 sm:mt-0">
                      <span className="hover:text-slate-400 cursor-pointer">गोपनीयता नीति</span>
                      <span className="hover:text-slate-400 cursor-pointer">सेवा की शर्तें</span>
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
